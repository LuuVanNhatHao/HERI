project:
  name: HERA-DGM
  seed: 42
dataset:
  name: DGM4
  root: data/DGM4
  train_annotations: data/DGM4/train.json
  val_annotations: data/DGM4/val.json
  test_annotations: data/DGM4/test.json
  image_root: data/DGM4/images
  verify_hashes: true
  verify_image_exists: true
image:
  size: 384
  preserve_aspect_ratio: true
  padding: true
tokenizer:
  enabled: true
  name: microsoft/deberta-v3-large
  use_fast: true
  max_length: 64
  local_files_only: false
  ignore_index: -100
backbones:
  siglip2:
    name: google/siglip2-so400m-patch14-384
    revision:
    local_files_only: false
    trust_remote_code: false
    image_mean: [0.5, 0.5, 0.5]
    image_std: [0.5, 0.5, 0.5]
    text_max_length: 64
  dinov3:
    name: facebook/dinov3-vitl16-pretrain-lvd1689m
    revision:
    local_files_only: false
    trust_remote_code: false
    image_mean: [0.485, 0.456, 0.406]
    image_std: [0.229, 0.224, 0.225]
  deberta:
    name: microsoft/deberta-v3-large
    revision:
    local_files_only: false
    trust_remote_code: false
model:
  baseline_type: b1_cross_attention
  fusion_dim: 512
  num_attention_layers: 2
  num_heads: 8
  head_hidden_dim: 512
  dropout: 0.1
loss:
  weights: {binary: 1.0, attribution: 1.0, image_grounding: 1.0, text_grounding: 1.0}
training:
  epochs: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  resume_from:
  stages:
    stage_a_freeze_epochs: 1
    stage_b_unfreeze_last_blocks: {siglip2: 0, dinov3: 0, deberta: 0}
optimizer:
  type: adamw
  lr_new: 0.0001
  lr_backbones: {siglip2: 0.000002, dinov3: 0.000002, deberta: 0.000002}
  weight_decay: 0.01
scheduler:
  type: linear_warmup
  warmup_steps: 1
thresholding:
  enabled: true
  binary: {objective: macro_f1, min: 0.1, max: 0.9, step: 0.1}
  attribution: {mode: per_class, objective: f1, min: 0.1, max: 0.9, step: 0.1}
checkpointing:
  selection_metric: cf1
  tie_breakers: [map, auc, text_f1, image_mean_iou]
  keep_best: true
  keep_last: true
  top_k: 1
dataloader:
  batch_size: 1
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  shuffle: {train: true, val: false, test: false}
  drop_last: false
  seed: 42
  id_aware_sampler: {enabled: false}
runtime:
  device: cuda
  precision: bf16
  model_dtype: bf16
  attn_implementation:
  max_train_batches: 2
  max_val_batches: 2
  max_test_batches: 2
smoke:
  split: train
  max_samples: 8
  samples_per_class: 1
  inspect_batches: 1
  backward: true
progress:
  enabled: true
logging:
  level: INFO
output:
  root: outputs/phase2_smoke
