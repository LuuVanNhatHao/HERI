suite:
  name: hera_dgm4_cycle_depth_and_state_refinement
  base_train_config: config/train_hera.yaml
  base_evaluate_config: config/evaluate_hera.yaml
  output_root: outputs/hera_cycle_study
  training_epochs: 20
  micro_batch_size: 16
  gradient_accumulation_steps: 1
  fail_fast: true
  variants:
    - single_pass
    - two_cycle_static
    - full_hera
    - three_cycle_extension
  environment:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
