suite:
  name: hera_dgm4_canonical_multiseed
  base_train_config: config/datasets/dgm4/heri/train.yaml
  base_evaluate_config: config/datasets/dgm4/heri/evaluate.yaml
  output_root: artifacts/experiments/matched_seeds
  training_epochs: 20
  fail_fast: true
  seeds:
  - 7
  - 21
  - 101
  aggregate_metrics:
  - acc
  - auc
  - cf1
  - of1
  - map
  - image_mean_iou
  - image_iou50
  - image_iou75
  - text_f1
  - real_f1
  - fake_f1
  - fs_f1
  - fa_f1
  - ts_f1
  - ta_f1
  environment:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
