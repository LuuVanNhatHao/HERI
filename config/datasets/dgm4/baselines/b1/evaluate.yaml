project:
  name: HERI-DGM4
  seed: 7
  architecture_version: heri_baseline
  config_name: dgm4/baselines/b1/evaluate
  run_id: evaluate_baseline_b1
dataset:
  name: DGM4
  root: data/DGM4
  train_annotations: data/DGM4/train.json
  val_annotations: data/DGM4/val.json
  test_annotations: data/DGM4/test.json
  image_root: data/DGM4/images
  use_mtcnn_boxes: false
  verify_hashes: true
  verify_image_exists: true
dataset_hashes:
  train: dafd4fe101d3de63b433759fae79b14b465294f7be73f26c9f3bb13b8de87704
  val: d4377ecc19cb6528e36c77401482cbfffaa57977faee2c6124e3b1bdda045520
  test: b58b29c4cf0f40cdf791189181ad57821f9359e358e93683cc702db3a41c0a18
image:
  size: 384
  preserve_aspect_ratio: true
  padding: true
tokenizer:
  enabled: true
  name: microsoft/deberta-v3-large
  use_fast: true
  max_length: 64
  local_files_only: false
  ignore_index: -100
backbones:
  siglip2:
    name: google/siglip2-so400m-patch14-384
    revision: null
    local_files_only: false
    trust_remote_code: false
    image_mean:
    - 0.5
    - 0.5
    - 0.5
    image_std:
    - 0.5
    - 0.5
    - 0.5
    text_max_length: 64
  dinov3:
    name: facebook/dinov3-vitl16-pretrain-lvd1689m
    revision: null
    local_files_only: false
    trust_remote_code: false
    image_mean:
    - 0.485
    - 0.456
    - 0.406
    image_std:
    - 0.229
    - 0.224
    - 0.225
  deberta:
    name: microsoft/deberta-v3-large
    revision: null
    local_files_only: false
    trust_remote_code: false
model:
  baseline_type: b1_cross_attention
  fusion_dim: 512
  num_attention_layers: 2
  num_heads: 8
  head_hidden_dim: 512
  dropout: 0.1
loss:
  weights:
    binary: 0.1
    attribution: 1.0
    image_grounding: 1.0
    text_grounding: 1.0
training:
  epochs: 20
  micro_batch_size: 16
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  resume_from: null
  auto_resume:
    enabled: false
    run_dir: null
    checkpoint_name: last.pt
  early_stopping:
    enabled: false
    metric: cf1_fixed
    mode: max
    patience: 3
    min_delta: 0.001
    minimum_backbone_adaptation_epochs: 3
  stages:
    stage_a_freeze_epochs: 3
    stage_b_full_unfreeze:
      enabled: true
      start_epoch: 4
optimizer:
  type: adamw
  lr_new: 0.0001
  lr_backbones:
    siglip2: 2.0e-06
    dinov3: 2.0e-06
    deberta: 2.0e-06
  weight_decay: 0.01
  foreach: false
scheduler:
  type: linear_warmup
  warmup_steps: 500
  resume_horizon_policy: error
thresholding:
  enabled: false
  binary:
    objective: macro_f1
    min: 0.05
    max: 0.95
    step: 0.01
  attribution:
    mode: per_class
    objective: f1
    min: 0.05
    max: 0.95
    step: 0.01
  image_presence:
    enabled: true
    objective: macro_f1
    min: 0.05
    max: 0.95
    step: 0.01
checkpointing:
  selection_metric: cf1_fixed
  tie_breakers:
  - map
  - auc
  - text_f1
  - image_mean_iou
  keep_best: true
  keep_last: true
  top_k: 0
evaluation:
  checkpoint_path: null
  thresholds_path: null
  split: test
  checkpoint_resolution:
    enabled: true
    mode: latest
    output_root: artifacts/experiments/baselines_heri
    run_dir: null
    checkpoint_name: best.pt
    thresholds_name: best_thresholds.json
dataloader:
  batch_size: 16
  num_workers: 16
  worker_threads: 1
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  shuffle:
    train: true
    val: false
    test: false
  drop_last: false
  seed: 7
  id_aware_sampler:
    enabled: false
runtime:
  device: cuda
  precision: bf16
  model_dtype: fp32
  cuda_memory_logging:
    enabled: true
  attn_implementation: null
  gradient_checkpointing:
    enabled: false
    only_trainable_backbones: true
    use_reentrant: false
    backbones:
      siglip2: false
      dinov3: false
      deberta: false
  max_train_batches: null
  max_val_batches: null
  max_test_batches: null
  fail_on_nan: true
progress:
  enabled: true
logging:
  level: INFO
output:
  root: artifacts/experiments/baselines_heri_eval
