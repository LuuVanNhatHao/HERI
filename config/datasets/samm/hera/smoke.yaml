_base_: ../../dgm4/hera/smoke.yaml

project:
  name: HERA-SAMM
  config_name: samm/hera/smoke

dataset:
  name: SAMM
  root: data/SAMM
  train_annotations: data/SAMM/train.json
  val_annotations: data/SAMM/val.json
  test_annotations: data/SAMM/test.json
  image_root: data/SAMM/images
  jpeg_draft: true
  annotation_policy:
    clip_boxes: true
    mask_missing_image_boxes: true
    mask_invalid_text_positions: true

dataset_hashes:
  train: 86ddcace282a029633446ca382523a3867ac2238b846182dda956113283dcbd5
  val: dd5663c7775024bc14741ccb58efba37a0b9033c926365f960756692ea041df0
  test: 2c4d43a67b00ad85805c0ece348433d0a485f138b28344cca002d66957d14552

tokenizer:
  max_length: 128

backbones:
  siglip2:
    text_max_length: 64

model:
  hypotheses:
    order: [SWAP, ATTRIBUTE]
    image: [SWAP, ATTRIBUTE]
    text: [SWAP, ATTRIBUTE]

smoke:
  max_samples: 3
  train_max_samples: 3
  val_max_samples: 3
  test_max_samples: 3
  samples_per_class: 1
  inspect_batches: 3

output:
  root: outputs/samm/hera_smoke
