_base_: evaluate.yaml

project:
  name: HERA-SAMM-ontology-image-gate
  config_name: samm/hera/evaluate_seed42
  run_id: samm_hera_seed42_ontology_image_gate_test

evaluation:
  checkpoint_path: /workspace/checkpoints/hera_samm20k_seed42/checkpoints/best.pt
  thresholds_path: /workspace/checkpoints/hera_samm20k_seed42/thresholds/best_thresholds.json
  # The archived checkpoint predates the dedicated modality threshold.  On
  # SAMM every configured hypothesis is image-grounded, so the saved
  # validation binary threshold is the exact ontology Noisy-OR fallback.
  image_presence_threshold_fallback: binary

output:
  root: outputs/samm/hera_eval
